services:
  redis:
    image: redis:7-alpine
    container_name: ai-trader-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: ai-trader-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AI_TRADER_DEBUG: "false"
      AI_TRADER_LOG_LEVEL: "INFO"
      AI_TRADER_USE_MOCK_DATA: "false"
      AI_TRADER_REDIS_URL: "redis://redis:6379/0"
      AI_TRADER_BINANCE_BASE_URL: "https://api.binance.com"
      AI_TRADER_CORS_ORIGINS_RAW: "http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://154.219.111.145"
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: ai-trader-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  redis-data:

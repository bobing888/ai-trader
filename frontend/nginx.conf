upstream ai_trader_backend {
    server backend:8765;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name dyddd.com www.dyddd.com;

    # Let's Encrypt 续期需要这个 endpoint（虽然 acme.sh 现在用 DNS-01，但保留兼容）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dyddd.com www.dyddd.com;

    ssl_certificate     /etc/nginx/ssl/dyddd.com.crt;
    ssl_certificate_key /etc/nginx/ssl/dyddd.com.key;
    ssl_trusted_certificate /etc/nginx/ssl/dyddd.com.chain.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全 headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # 安全：阻断敏感路径
    location ~ /\.(git|env|svn|hg) {
        deny all;
        return 404;
    }
    location ~ /(node_modules|__pycache__|\.venv) {
        deny all;
        return 404;
    }

    # 反代 API 到 backend 容器
    location /api/ {
        proxy_pass http://ai_trader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA fallback (no-cache for HTML so updates land immediately)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}

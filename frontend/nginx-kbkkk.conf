upstream ai_trader_backend {
    server backend:8765;
}

# kbkkk-prod 专用：纯 HTTP（不走 HTTPS 重定向，因为 kbkkk 还没 SSL）
server {
    listen 80;
    listen [::]:80;
    server_name kbkkk.com www.kbkkk.com _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全：阻断敏感路径
    location ~ /\.(git|env|svn|hg) {
        deny all;
        return 404;
    }
    location ~ /(node_modules|__pycache__|\.venv) {
        deny all;
        return 404;
    }

    # 反代 API 到 backend 容器
    location /api/ {
        proxy_pass http://ai_trader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA fallback (no-cache for HTML so updates land immediately)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}